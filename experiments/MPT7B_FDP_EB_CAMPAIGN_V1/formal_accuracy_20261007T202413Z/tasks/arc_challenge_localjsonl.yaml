task: arc_challenge_localjsonl
dataset_path: json
dataset_kwargs:
  data_files:
    train: /diskF/jiaqizhang/a1804298693/offline_datasets/ai2_arc/ARC-Challenge/ARC-Challenge-Train.jsonl
    test:  /diskF/jiaqizhang/a1804298693/offline_datasets/ai2_arc/ARC-Challenge/ARC-Challenge-Test.jsonl
training_split: train
test_split: test
output_type: multiple_choice

doc_to_text: "Question: {{ question }}\nAnswer:"

# 必须是“单行纯表达式”，返回原生 list
doc_to_choice: "{{ choices.text }}"

# 返回正确选项的 index（0..N-1）
doc_to_target: "{{ choices.label.index(answerKey) }}"

metric_list:
  - metric: acc
  - metric: acc_norm
