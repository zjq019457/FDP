task: openbookqa_localjsonl
dataset_path: parquet
dataset_kwargs:
  data_files:
    train: /diskE/jiaqizhang/PALU_FDP_NATIVE_EXCHANGE_FORMAL_V1/datasets/allenai/openbookqa/main/train-00000-of-00001.parquet
    validation: /diskE/jiaqizhang/PALU_FDP_NATIVE_EXCHANGE_FORMAL_V1/datasets/allenai/openbookqa/main/validation-00000-of-00001.parquet
    test: /diskE/jiaqizhang/PALU_FDP_NATIVE_EXCHANGE_FORMAL_V1/datasets/allenai/openbookqa/main/test-00000-of-00001.parquet
training_split: train
validation_split: validation
test_split: test
output_type: multiple_choice
doc_to_text: "{{ question_stem }}"
doc_to_target: "{{ choices.label.index(answerKey.lstrip()) }}"
doc_to_choice: "{{ choices.text }}"
should_decontaminate: true
doc_to_decontamination_query: question_stem
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  local_binding: true
